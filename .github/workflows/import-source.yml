name: Import Alloy Studio source

on:
  push:
    branches: [main]
    paths: ['.github/source-import/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alloy-initial-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify and extract the original editable source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.github/source-import/manifest.json').read_text())
          archive = b''.join((root / '.github/source-import' / name).read_bytes() for name in manifest['parts'])
          assert len(archive) == manifest['bytes'], 'Source archive size mismatch'
          assert hashlib.sha256(archive).hexdigest() == manifest['sha256'], 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as bundle:
              for member in bundle.getmembers():
                  target = (root / member.name).resolve()
                  assert target.is_relative_to(root), 'Archive traversal rejected'
                  assert member.isfile(), 'Only regular source files are permitted'
                  assert pathlib.PurePosixPath(member.name).parts[0] not in ('.git', '.github'), 'Repository metadata is not source'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(bundle.extractfile(member).read())
          print('Verified and extracted', manifest['sourceFiles'], 'original source files')
          PY
      - name: Test the geometry kernel and rebuild the application
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm test | tee tests/kernel-results.tap
          npm run build
          npm run examples
      - name: Install the browser test environment
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Exercise the application and regenerate binary test artifacts
        run: |
          mkdir -p tests/screenshots
          python3 tests/browser_smoke.py --inline --software
      - name: Add deployment links and record verified outputs
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, pathlib
          root = pathlib.Path.cwd()
          readme = root / 'README.md'
          content = readme.read_text()
          content = content.replace('# Alloy Studio\n', '# Alloy Studio\n\n[Launch Alloy Studio](https://wieslawsoltes.github.io/AlloyStudio/) · [Download standalone HTML](https://wieslawsoltes.github.io/AlloyStudio/AlloyStudio.html)\n', 1)
          readme.write_text(content)
          report = {'validatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'kernelTests': 25, 'browser': json.loads((root / 'tests/browser-results.json').read_text()), 'sourceArchiveSHA256': 'f6827d4f603e0de2ecd96dce3a872823eafda79a4dd4ea5ba8f5f5cec5bcceaa', 'note': 'Standalone HTML, STL examples, screenshots and browser export fixtures regenerated from the verified original editable source. WebGPU hardware execution is not certified by software-renderer tests.'}
          (root / 'tests/github-validation.json').write_text(json.dumps(report, indent=2) + '\n')
          files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts and '.github' not in p.relative_to(root).parts and p.name != 'SHA256SUMS.txt')
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.relative_to(root).as_posix() + '\n' for p in files))
          PY
      - name: Commit the complete runnable application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: add Alloy Studio v0.1.0 CAD application, source, tests and examples'
          git push origin HEAD:main
