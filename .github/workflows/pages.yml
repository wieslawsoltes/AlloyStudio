name: Test and publish Alloy Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test geometry kernel and build standalone application
        run: |
          npm test
          npm run build
          python3 tools/build-manifest.py
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate editing and import/export workflows
        run: |
          rm -f tests/browser-results.json
          python3 tests/browser_smoke.py --inline --software
      - name: Record validation summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('tests/browser-results.json')
          if path.exists():
              result = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"Browser checks: {result['passed']}; backend: {result['backend']}.\n\n")
                  summary.write('Software-renderer validation does not certify hardware WebGPU execution.\n')
          PY
      - name: Upload the validated Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Rebuild the validated source revision for integrity verification
        run: |
          npm run build
          python3 tools/build-manifest.py
      - name: Deploy the validated artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the public HTTPS deployment
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/verify-pages.py
      - name: Install live browser verification dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Exercise the published application over HTTPS
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 tests/browser_smoke.py --url "${PAGES_URL}?renderer=webgl" --software
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path('tests/browser-results.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Live HTTPS browser checks: {result['passed']}; JavaScript errors: {len(result['pageErrors'])}.\n")
          PY
