name: Test and publish Alloy Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alloy-studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test geometry kernel and build standalone application
        run: |
          npm test
          npm run build
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Validate editing and import/export workflows
        run: python3 tests/browser_smoke.py --inline --software
      - name: Record validation summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('tests/browser-results.json')
          if path.exists():
              result = json.loads(path.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"Browser checks: {result['passed']}; backend: {result['backend']}.\n\n")
                  summary.write('Software-renderer validation does not certify hardware WebGPU execution.\n')
          PY

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Rebuild the validated source revision
        run: |
          npm run build
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('dist')
          files = ['index.html', 'AlloyStudio.html']
          result = {'sourceCommit': os.environ['GITHUB_SHA'], 'sha256': {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in files}}
          (root/'build-info.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Update gh-pages without rewriting history
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages
          target="$RUNNER_TEMP/alloy-pages"
          git worktree add --detach "$target" origin/gh-pages
          rsync -a --delete --exclude='.git' --exclude='CNAME' dist/ "$target/"
          git -C "$target" add --all
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m "deploy: Alloy Studio from ${GITHUB_SHA}"
            git -C "$target" push origin HEAD:gh-pages
          fi
          echo "commit=$(git -C "$target" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request Pages build and verify the public deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_COMMIT: ${{ steps.branch.outputs.commit }}
        run: python3 tools/verify-pages.py
      - name: Install live browser verification dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Exercise the published application over HTTPS
        run: |
          python3 tests/browser_smoke.py --url 'https://wieslawsoltes.github.io/AlloyStudio/?renderer=webgl' --software
          python3 - <<'PY'
          import json, os, pathlib
          result = json.loads(pathlib.Path('tests/browser-results.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Live HTTPS browser checks: {result['passed']}; JavaScript errors: {len(result['pageErrors'])}.\n")
          PY
